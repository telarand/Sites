<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прямоугольники</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #1a2639 0%, #0e1a2b 100%);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            color: #ffeaa5;
            text-shadow: 0 4px 10px rgba(0,0,0,0.6);
            font-size: 2.5rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 600px;
            width: 100%;
        }
        .card {
            background: #ffeaa5;
            border-radius: 20px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.5);
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 35px rgba(255, 234, 165, 0.4);
        }
        .card a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-decoration: none;
            font-size: 5rem;
            font-weight: 800;
            color: #1e3d58;
            border-radius: 20px;
            background: radial-gradient(circle at 30% 30%, #fff3c9, #ffeaa5);
            transition: background 0.2s;
        }
        .card a:hover {
            background: radial-gradient(circle at 30% 30%, #ffeeb8, #ffd97e);
        }
        footer {
            margin-top: 40px;
            color: #b0c4ce;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1>Выбери цифру</h1>
    <div class="grid">
        <div class="card"><a href="page1.html">1</a></div>
        <div class="card"><a href="page2.html">2</a></div>
        <div class="card"><a href="page3.html">3</a></div>
        <div class="card"><a href="page4.html">4</a></div>
        <div class="card"><a href="page5.html">5</a></div>
        <div class="card"><a href="page6.html">6</a></div>
        <div class="card"><a href="page7.html">7</a></div>
        <div class="card"><a href="page8.html">8</a></div>
        <div class="card"><a href="page9.html">9</a></div>
	<div class="card"><a href="page10.html">10</a></div>
	<div class="card"><a href="page11.html">11</a></div>
	<div class="card"><a href="page12.html">12</a></div>
	<div class="card"><a href="page13.html">13</a></div>
	<div class="card"><a href="page14.html">14</a></div>
	<div class="card"><a href="page15.html">15</a></div>
    </div>
</body>
</html>
